<style>
#newsletter, #newsletter * { box-sizing: border-box; }
#newsletter { background:#fff8f0; color:#1e3a2a; padding:48px 24px; border-top:4px solid #8a5a3a; }
#newsletter h2 { font-family: inherit; font-size:32px; margin:0 0 16px; color:#1e3a2a; }
#newsletter form { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
#newsletter label { font-weight:600; margin-right:8px; }
#newsletter input#email { flex:1 1 260px; padding:12px 14px; border:2px solid #1e3a2a; border-radius:8px; background:#fff; color:#1e3a2a; font-size:16px; }
#newsletter button[type="submit"] { background:#1e3a2a; color:#fff8f0; border:none; padding:12px 18px; border-radius:8px; font-weight:600; cursor:pointer; }
#newsletter button[type="submit"]:hover { background:#2a4a3a; }
#newsletter .privacy { margin:12px 0 0; font-size:13px; color:#4a5a4a; }
#newsletter #newsletter-status { margin:8px 0 0; font-weight:600; }
footer { background:#1e3a2a; color:#fff8f0; padding:32px 24px; }
footer p { margin:0 0 12px; font-weight:600; }
footer nav a { color:#fff8f0; margin-right:16px; text-decoration:none; }
footer nav a:hover { text-decoration:underline; }
footer small { display:block; margin-top:12px; color:#c9d9c9; }
@media (max-width:600px){ #newsletter h2 { font-size:26px; } #newsletter form { flex-direction:column; align-items:stretch; } #newsletter input#email, #newsletter button[type="submit"] { width:100%; } }
</style>
<section id="newsletter">
  <h2>Stay connected</h2>
  <form id="newsletter-form">
    <label for="email">Email address</label>
    <input id="email" type="email" required aria-required="true" placeholder="you@example.com">
    <button type="submit">Sign up</button>
    <p id="newsletter-status" role="status" aria-live="polite"></p>
  </form>
  <p class="privacy">We’re a nonprofit cafe. No spam, unsubscribe anytime. Your email is used only for updates about community programs.</p>
</section>
<footer>
  <p>Common Ground Coffee — nonprofit cafe in Palo Alto</p>
  <nav aria-label="Footer links">
    <a href="#top">Top</a>
    <a href="#menu">Menu</a>
    <a href="#mission">Mission</a>
    <a href="#events">Events</a>
    <a href="#visit">Visit</a>
  </nav>
  <small>© Common Ground Coffee. 100% of surplus funds support job training.</small>
</footer>
